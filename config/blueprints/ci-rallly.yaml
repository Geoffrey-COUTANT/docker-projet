# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: docker-projet-ci-rallly
  labels:
    blueprints.goauthentik.io/description: Ephemeral Rallly OIDC integration-test setup
entries:
  - model: authentik_core.group
    identifiers:
      name: rallly-users
    attrs:
      name: rallly-users
  - model: authentik_core.group
    identifiers:
      name: rallly-admins
    attrs:
      name: rallly-admins
  - model: authentik_providers_oauth2.oauth2provider
    id: rallly-oidc-provider
    identifiers:
      name: Rallly OIDC
    attrs:
      name: Rallly OIDC
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: !Env RALLLY_OIDC_CLIENT_ID
      client_secret: !Env RALLLY_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: !Env RALLLY_OIDC_REDIRECT_URI
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
  - model: authentik_core.application
    id: rallly-oidc-application
    identifiers:
      slug: rallly
    attrs:
      name: Rallly
      provider: !KeyOf rallly-oidc-provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rallly-oidc-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, rallly-users]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rallly-oidc-application
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, rallly-admins]]
  - model: authentik_core.user
    identifiers:
      username: rallly-ci-user
    attrs:
      name: Rallly CI User
      email: rallly-ci-user@example.test
      is_active: true
      password: !Env RALLLY_TEST_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, rallly-users]]
  - model: authentik_core.user
    identifiers:
      username: rallly-ci-denied
    attrs:
      name: Rallly CI Denied
      email: rallly-ci-denied@example.test
      is_active: true
      password: !Env RALLLY_TEST_PASSWORD
